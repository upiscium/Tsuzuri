# A deliberately small set of upstream engines, qualified on the local LXC probe.
# Search is performed by Tsuzuri on the Docker-internal network only.
use_default_settings:
  engines:
    keep_only:
      - bing
      - bing news
      - google
      - google news
      - duckduckgo
      - duckduckgo news
      - wikipedia
      - arxiv

general:
  debug: false
  instance_name: Tsuzuri bundled SearXNG

search:
  default_lang: en
  formats:
    - html
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: false

valkey:
  url: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  pool_connections: 24
  enable_http2: false
